<text x="454.9" y="148" font-size="11.5" font-weight="600" fill="#b03030">42% → all 25</text>
<text x="78" y="510" font-size="11.5" fill="#555">AUC 0.95 (95% 0.91–0.99) is a pairwise win rate: pick one drift day and one non-drift day, and the drift day ranks</text>
<text x="78" y="525" font-size="11.5" fill="#555">higher 95% of the time. It scores the ORDER only, which is what a ranked deliverable needs. Run the same rows twice</text>
<text x="78" y="540" font-size="11.5" fill="#555">and 6 verdicts flip while AUC holds to two decimals — the order reproduces, the labels do not, which is why this is</text>
<text x="78" y="555" font-size="11.5" fill="#555">a ranked list and not a verdict. The 42% mark is set by the single worst-ranked drift day; resampling puts it</text>
<text x="78" y="570" font-size="11.5" fill="#555">anywhere from far lower to far higher. With 25 drift days the curve's SHAPE is the finding and every particular cut</text>
<text x="78" y="585" font-size="11.5" fill="#555">is noise — and the confidence threshold that would pick one was tuned on these same rows, so it is in-sample</text>
<text x="78" y="600" font-size="11.5" fill="#555">besides. The labelled set is 100 days; 7 of them are open-goal, where drift is undefined by construction, so the</text>
<text x="78" y="615" font-size="11.5" fill="#555">curve scores the 93 that carry a true/false label.</text>
</svg>