<svg xmlns="http://www.w3.org/2000/svg" width="940" height="700" font-family="Helvetica,Arial,sans-serif" font-size="13">
<rect width="940" height="700" fill="#ffffff"/>
<text x="56" y="36" font-size="17" fill="#111111" font-weight="600" font-family="Helvetica,Arial,sans-serif">Two-stage goal-drift detection</text>
<text x="56" y="72" font-size="13" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">4,091 agent-days</text>
<text x="56" y="89" font-size="11" fill="#9a9a95" font-weight="400" font-family="Helvetica,Arial,sans-serif">computer use · chat · memory</text>
<line x1="266" y1="98" x2="266" y2="119" stroke="#5f5f5c" stroke-width="1.3"/><path d="M 266 126 L 262 119 L 270 119 z" fill="#5f5f5c"/>
<rect x="56" y="130" width="420" height="74" rx="6" fill="#f7f7f5" stroke="#9c2b2b" stroke-width="1.3"/>
<text x="72" y="152" font-size="10" fill="#9c2b2b" font-weight="700" font-family="Helvetica,Arial,sans-serif">STAGE 1</text>
<text x="136" y="152" font-size="10" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">unit: the agent-day</text>
<text x="72" y="175" font-size="13" fill="#111111" font-weight="400" font-family="Helvetica,Arial,sans-serif">Was this day spent on the assigned goal?</text>
<text x="72" y="194" font-size="11" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">yes · no · can't tell — plus a confidence score</text>
<line x1="266" y1="204" x2="266" y2="227" stroke="#5f5f5c" stroke-width="1.3"/><path d="M 266 234 L 262 227 L 270 227 z" fill="#5f5f5c"/>
<rect x="56" y="234" width="420" height="56" rx="6" fill="none" stroke="#cfcfca" stroke-width="1.1"/>
<text x="72" y="255" font-size="10" fill="#111111" font-weight="700" font-family="Helvetica,Arial,sans-serif">SELECTION</text>
<text x="72" y="276" font-size="13" fill="#111111" font-weight="400" font-family="Helvetica,Arial,sans-serif">a 'yes', or a 'no' the judge was unsure of (confidence &lt; 0.74)</text>
<line x1="266" y1="290" x2="266" y2="313" stroke="#5f5f5c" stroke-width="1.3"/><path d="M 266 320 L 262 313 L 270 313 z" fill="#5f5f5c"/>
<rect x="56" y="320" width="420" height="56" rx="6" fill="none" stroke="#cfcfca" stroke-width="1.1"/>
<text x="72" y="341" font-size="10" fill="#111111" font-weight="700" font-family="Helvetica,Arial,sans-serif">WINDOW</text>
<text x="72" y="362" font-size="13" fill="#111111" font-weight="400" font-family="Helvetica,Arial,sans-serif">the days before it, as far back as 250K tokens allow</text>
<line x1="266" y1="376" x2="266" y2="399" stroke="#5f5f5c" stroke-width="1.3"/><path d="M 266 406 L 262 399 L 270 399 z" fill="#5f5f5c"/>
<rect x="56" y="406" width="420" height="146" rx="6" fill="#f7f7f5" stroke="#1a6b4e" stroke-width="1.3"/>
<text x="72" y="428" font-size="10" fill="#1a6b4e" font-weight="700" font-family="Helvetica,Arial,sans-serif">STAGE 2</text>
<text x="136" y="428" font-size="10" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">unit: the episode</text>
<text x="74" y="456" font-size="11" fill="#1a6b4e" font-weight="700" font-family="Helvetica,Arial,sans-serif">1</text>
<text x="90" y="456" font-size="12" fill="#111111" font-weight="600" font-family="Helvetica,Arial,sans-serif">explain</text>
<text x="152" y="456" font-size="12" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">split the window into separate activities</text>
<text x="74" y="489" font-size="11" fill="#1a6b4e" font-weight="700" font-family="Helvetica,Arial,sans-serif">2</text>
<text x="90" y="489" font-size="12" fill="#111111" font-weight="600" font-family="Helvetica,Arial,sans-serif">walk</text>
<text x="152" y="489" font-size="12" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">scan further back for the real start</text>
<text x="90" y="503" font-size="10" fill="#9a9a95" font-weight="400" font-family="Helvetica,Arial,sans-serif">only if it began before the window starts</text>
<text x="74" y="522" font-size="11" fill="#1a6b4e" font-weight="700" font-family="Helvetica,Arial,sans-serif">3</text>
<text x="90" y="522" font-size="12" fill="#111111" font-weight="600" font-family="Helvetica,Arial,sans-serif">revise</text>
<text x="152" y="522" font-size="12" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">judge again, with the earlier start</text>
<text x="90" y="536" font-size="10" fill="#9a9a95" font-weight="400" font-family="Helvetica,Arial,sans-serif">only if the scan found one</text>
<line x1="266" y1="552" x2="266" y2="575" stroke="#5f5f5c" stroke-width="1.3"/><path d="M 266 582 L 262 575 L 270 575 z" fill="#5f5f5c"/>
<rect x="56" y="582" width="420" height="56" rx="6" fill="#f7f7f5" stroke="#1a6b4e" stroke-width="1.3"/>
<text x="72" y="603" font-size="10" fill="#1a6b4e" font-weight="700" font-family="Helvetica,Arial,sans-serif">EPISODES</text>
<text x="72" y="624" font-size="11" fill="#111111" font-weight="400" font-family="Helvetica,Arial,sans-serif">the activity · when it drifted · why · what else it could do</text>
<text x="530" y="152" font-size="10" fill="#8a6a1a" font-weight="700" font-family="Helvetica,Arial,sans-serif">GATES</text>
<text x="530" y="168" font-size="10" fill="#9a9a95" font-weight="400" font-family="Helvetica,Arial,sans-serif">asked before each step; any can stop it</text>
<line x1="486" y1="258" x2="518" y2="258" stroke="#8a6a1a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="530" y="254" font-size="11" fill="#8a6a1a" font-weight="600" font-family="Helvetica,Arial,sans-serif">Is Stage 1 finished?</text>
<text x="530" y="270" font-size="10" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">list anything missing</text>
<text x="530" y="284" font-size="10" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">before starting Stage 2</text>
<line x1="486" y1="344" x2="518" y2="344" stroke="#8a6a1a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="530" y="340" font-size="11" fill="#8a6a1a" font-weight="600" font-family="Helvetica,Arial,sans-serif">Answered already?</text>
<text x="530" y="356" font-size="10" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">reuse an old result only</text>
<text x="530" y="370" font-size="10" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">if nothing has changed</text>
<line x1="486" y1="494" x2="518" y2="494" stroke="#8a6a1a" stroke-width="1" stroke-dasharray="3 3"/>
<text x="530" y="490" font-size="11" fill="#8a6a1a" font-weight="600" font-family="Helvetica,Arial,sans-serif">Can step 3 work?</text>
<text x="530" y="506" font-size="10" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">skip it if the evidence</text>
<text x="530" y="520" font-size="10" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">it needs is missing</text>
<text x="56" y="680" font-size="11" fill="#5f5f5c" font-weight="400" font-family="Helvetica,Arial,sans-serif">Stage 1 reads every day and is tuned to miss nothing. Stage 2 reads whole activities and decides what is real.</text>
</svg>