<text x="92" y="32" font-size="19" font-weight="600">Goal-drift labelling: what the judge should read</text>
<text x="92" y="52" font-size="12.5" fill="#666">accuracy on 40 sampled agent-days · 37 with a closed goal, 10 drift · cost from API usage, extrapolated with caching</text>
<line x1="92" y1="502.8" x2="640" y2="502.8" stroke="#e6e6e3"/>
<text x="80" y="506.8" text-anchor="end" fill="#666">0.65</text>
<line x1="92" y1="417.1" x2="640" y2="417.1" stroke="#e6e6e3"/>
<text x="80" y="421.1" text-anchor="end" fill="#666">0.70</text>
<line x1="92" y1="331.3" x2="640" y2="331.3" stroke="#e6e6e3"/>
<text x="80" y="335.3" text-anchor="end" fill="#666">0.75</text>
<line x1="92" y1="245.5" x2="640" y2="245.5" stroke="#e6e6e3"/>
<text x="80" y="249.5" text-anchor="end" fill="#666">0.80</text>
<line x1="92" y1="159.8" x2="640" y2="159.8" stroke="#e6e6e3"/>
<text x="80" y="163.8" text-anchor="end" fill="#666">0.85</text>
<line x1="92" y1="74.0" x2="640" y2="74.0" stroke="#e6e6e3"/>
<text x="80" y="78.0" text-anchor="end" fill="#666">0.90</text>
<line x1="139.2" y1="74" x2="139.2" y2="520" stroke="#e6e6e3"/>
<text x="139.2" y="540" text-anchor="middle" fill="#666">$100</text>
<line x1="405.8" y1="74" x2="405.8" y2="520" stroke="#e6e6e3"/>
<text x="405.8" y="540" text-anchor="middle" fill="#666">$1,000</text>
<text x="366" y="562" text-anchor="middle" fill="#333">cost to label all 4,027 agent-days — log scale →</text>
<text transform="translate(26,297) rotate(-90)" text-anchor="middle" fill="#333">accuracy</text>
<line x1="478.3" y1="176.9" x2="565.7" y2="176.9" stroke="#5a6b8c" stroke-width="7" opacity="0.18"/>
<line x1="478.3" y1="169.9" x2="478.3" y2="183.9" stroke="#5a6b8c" stroke-width="1.6" opacity="0.6"/>
<text x="470.3" y="202.9" text-anchor="end" font-size="11" fill="#5a6b8c" opacity="0.85">$1,871 if its shared transcript caches</text>
<line x1="200.5" y1="176.9" x2="551.7" y2="176.9" stroke="#1a7f5a" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.55"/>
<text x="436.8" y="163.9" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a7f5a">same accuracy, 26x the cost</text>
<circle cx="161.2" cy="417.1" r="9" fill="#b03030" stroke="#b03030" stroke-width="1" />
<text x="176.2" y="435.1" font-weight="600" fill="#b03030">B  model-computed facts</text>
<text x="176.2" y="451.1" font-size="11.5" fill="#777">$121  ·  $0.030/day</text>
<circle cx="486.4" cy="228.4" r="9" fill="#c98a1e" stroke="#c98a1e" stroke-width="1" />
<text x="501.4" y="246.4" font-weight="600" fill="#c98a1e">C  screen → judge</text>
<text x="501.4" y="262.4" font-size="11.5" fill="#777">$2,007  ·  $0.499/day</text>
<circle cx="565.7" cy="176.9" r="9" fill="none" stroke="#5a6b8c" stroke-width="2.5" stroke-dasharray='4 3'/>
<text x="580.7" y="148.9" font-weight="600" fill="#5a6b8c">0  incumbent monitor (est.)</text>
<text x="580.7" y="164.9" font-size="11.5" fill="#777">$3,980  ·  $0.988/day</text>
<circle cx="186.5" cy="176.9" r="11" fill="#1a7f5a" stroke="#1a7f5a" stroke-width="1" />
<text x="201.5" y="170.9" font-weight="600" fill="#1a7f5a">A  mechanical block</text>
<text x="201.5" y="186.9" font-size="11.5" fill="#777">$150  ·  $0.037/day</text>
<text x="92" y="608" font-size="11.5" fill="#555">Accuracy differences between A, C and the incumbent are within sampling noise at 10 drift days — treat them</text>
<text x="92" y="624" font-size="11.5" fill="#555">as tied. Cost is not noisy: it is measured, and separates them by more than an order of magnitude. Arm B is</text>
<text x="92" y="640" font-size="11.5" fill="#555">the exception that is not a tie; its recall of 0.10 falls below simply answering “not drift” every time.</text>
</svg>