<svg xmlns="http://www.w3.org/2000/svg" width="940" height="680" font-family="Helvetica,Arial,sans-serif" font-size="13">
<rect width="940" height="680" fill="#fbfbfa"/>
<text x="92" y="32" font-size="19" font-weight="600">Goal-drift labelling: what the judge should read</text>
<text x="92" y="52" font-size="12.5" fill="#666">accuracy on 40 sampled agent-days · 37 with a closed goal, 10 drift · cost from API usage, extrapolated with caching</text>
<line x1="92" y1="502.8" x2="640" y2="502.8" stroke="#e6e6e3"/>
<text x="80" y="506.8" text-anchor="end" fill="#666">0.65</text>
<line x1="92" y1="417.1" x2="640" y2="417.1" stroke="#e6e6e3"/>
<text x="80" y="421.1" text-anchor="end" fill="#666">0.70</text>
<line x1="92" y1="331.3" x2="640" y2="331.3" stroke="#e6e6e3"/>
<text x="80" y="335.3" text-anchor="end" fill="#666">0.75</text>
<line x1="92" y1="245.5" x2="640" y2="245.5" stroke="#e6e6e3"/>
<text x="80" y="249.5" text-anchor="end" fill="#666">0.80</text>
<line x1="92" y1="159.8" x2="640" y2="159.8" stroke="#e6e6e3"/>
<text x="80" y="163.8" text-anchor="end" fill="#666">0.85</text>
<line x1="92" y1="74.0" x2="640" y2="74.0" stroke="#e6e6e3"/>
<text x="80" y="78.0" text-anchor="end" fill="#666">0.90</text>
<line x1="125.0" y1="74" x2="125.0" y2="520" stroke="#e6e6e3"/>
<text x="125.0" y="540" text-anchor="middle" fill="#666">$100</text>
<line x1="399.1" y1="74" x2="399.1" y2="520" stroke="#e6e6e3"/>
<text x="399.1" y="540" text-anchor="middle" fill="#666">$1,000</text>
<text x="366" y="562" text-anchor="middle" fill="#333">cost to label all 4,027 agent-days — log scale →</text>
<text transform="translate(26,297) rotate(-90)" text-anchor="middle" fill="#333">accuracy</text>
<line x1="473.7" y1="176.9" x2="563.6" y2="176.9" stroke="#5a6b8c" stroke-width="7" opacity="0.18"/>
<line x1="473.7" y1="169.9" x2="473.7" y2="183.9" stroke="#5a6b8c" stroke-width="1.6" opacity="0.6"/>
<text x="465.7" y="202.9" text-anchor="end" font-size="11" fill="#5a6b8c" opacity="0.85">$1,871 if its shared transcript caches</text>
<line x1="466.2" y1="176.9" x2="549.6" y2="176.9" stroke="#1a7f5a" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.55"/>
<text x="535.7" y="163.9" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1a7f5a">same accuracy, 7x the cost</text>
<circle cx="163.2" cy="279.8" r="9" fill="#b03030" stroke="#b03030" stroke-width="1" />
<text x="178.2" y="297.8" font-weight="600" fill="#b03030">D  context only, facts stripped</text>
<text x="178.2" y="313.8" font-size="11.5" fill="#777">$138  ·  $0.034/day</text>
<circle cx="482.1" cy="228.4" r="9" fill="#c98a1e" stroke="#c98a1e" stroke-width="1" />
<text x="497.1" y="246.4" font-weight="600" fill="#c98a1e">C  screen → judge</text>
<text x="497.1" y="262.4" font-size="11.5" fill="#777">$2,007  ·  $0.499/day</text>
<circle cx="452.2" cy="176.9" r="9" fill="#1a7f5a" stroke="#1a7f5a" stroke-width="1" />
<line x1="452.2" y1="187.9" x2="452.2" y2="226.9" stroke="#1a7f5a" stroke-width="1" opacity="0.35"/>
<text x="467.2" y="238.9" font-weight="600" fill="#1a7f5a">B  cheap model fills the schema</text>
<text x="467.2" y="254.9" font-size="11.5" fill="#777">$1,562  ·  $0.388/day</text>
<circle cx="563.6" cy="176.9" r="9" fill="none" stroke="#5a6b8c" stroke-width="2.5" stroke-dasharray='4 3'/>
<text x="578.6" y="148.9" font-weight="600" fill="#5a6b8c">0  incumbent monitor (est.)</text>
<text x="578.6" y="164.9" font-size="11.5" fill="#777">$3,980  ·  $0.988/day</text>
<circle cx="329.5" cy="176.9" r="11" fill="#1a7f5a" stroke="#1a7f5a" stroke-width="1" />
<text x="344.5" y="150.9" font-weight="600" fill="#1a7f5a">A  mechanical block</text>
<text x="344.5" y="166.9" font-size="11.5" fill="#777">$557  ·  $0.138/day</text>
<text x="92" y="608" font-size="11.5" fill="#555">A, B and the incumbent all score 0.84; C and D sit a little below, still inside the ±23pt band that 10 drift</text>
<text x="92" y="624" font-size="11.5" fill="#555">days buys. Treat every accuracy gap here as a tie. Cost is not noisy — it is measured, and separates the</text>
<text x="92" y="640" font-size="11.5" fill="#555">arms by more than an order of magnitude, so it is what should decide. A and B tie on accuracy and nearly on</text>
<text x="92" y="656" font-size="11.5" fill="#555">cost; A wins on being deterministic.</text>
</svg>